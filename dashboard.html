<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Dashboard Admin - Desa Sungai Kelambu</title>

<!-- FAVICON -->
<link
  rel="icon"
  href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2327382c'/%3E%3Cpath d='M18 48 50 20l32 28v32H62V60H38v20H18z' fill='%23f8f5ed'/%3E%3Cpath d='M50 20v12M25 46h50' stroke='%23c8a96b' stroke-width='5' fill='none'/%3E%3C/svg%3E"
>

<link
  href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
  rel="stylesheet"
>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: "DM Sans", sans-serif;
  background: #f8f5ed;
  color: #27382c;
}

.container {
  width: 92%;
  max-width: 1200px;
  margin: auto;
}

header {
  background: #27382c;
  color: white;
  padding: 20px 0;
}

.header-inner {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-family: "Playfair Display", serif;
  font-size: 24px;
}

.logout {
  border: none;
  background: #f8f5ed;
  color: #27382c;
  padding: 10px 15px;
  border-radius: 9px;
  font-weight: 700;
  cursor: pointer;
}

main {
  padding: 35px 0 60px;
}

.welcome {
  margin-bottom: 25px;
}

.welcome h1 {
  font-family: "Playfair Display", serif;
  font-size: 32px;
  margin-bottom: 6px;
}

.welcome p {
  color: #707970;
}

.status {
  display: none;
  padding: 13px 15px;
  border-radius: 10px;
  margin-bottom: 20px;
  background: #e4eee5;
}

.status.error {
  background: #f5dfdd;
  color: #8c3932;
}

.cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
  margin-bottom: 30px;
}

.card {
  background: white;
  padding: 23px;
  border-radius: 17px;
  box-shadow: 0 4px 15px rgba(39,56,44,.08);
}

.card small {
  color: #7a837c;
}

.number {
  font-size: 34px;
  font-weight: 700;
  margin-top: 7px;
}

.section {
  background: white;
  padding: 24px;
  border-radius: 17px;
  margin-bottom: 25px;
  box-shadow: 0 4px 15px rgba(39,56,44,.08);
}

.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
  gap: 10px;
}

.section h2 {
  font-family: "Playfair Display", serif;
  font-size: 23px;
}

.refresh {
  border: none;
  background: #27382c;
  color: white;
  padding: 9px 14px;
  border-radius: 8px;
  cursor: pointer;
}

.item {
  border: 1px solid #e3e7e3;
  border-radius: 13px;
  padding: 17px;
  margin-bottom: 12px;
}

.item:last-child {
  margin-bottom: 0;
}

.item-top {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}

.name {
  font-weight: 700;
}

.date {
  font-size: 13px;
  color: #858d87;
}

.label {
  font-size: 11px;
  text-transform: uppercase;
  font-weight: 700;
  color: #7a837c;
  margin-bottom: 5px;
}

.text {
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
}

.reply-btn {
  margin-top: 15px;
  border: none;
  background: #27382c;
  color: white;
  padding: 10px 15px;
  border-radius: 9px;
  cursor: pointer;
  font-weight: 600;
}

.empty {
  text-align: center;
  padding: 30px;
  color: #89918a;
}

.loading {
  text-align: center;
  padding: 25px;
  color: #727b74;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.45);
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 1000;
}

.modal-box {
  background: white;
  width: 100%;
  max-width: 500px;
  padding: 25px;
  border-radius: 17px;
}

.modal-box h2 {
  font-family: "Playfair Display", serif;
  margin-bottom: 15px;
}

.modal-box textarea {
  width: 100%;
  min-height: 150px;
  resize: vertical;
  border: 1px solid #d7ddd7;
  border-radius: 10px;
  padding: 12px;
  font-family: inherit;
  font-size: 15px;
  outline: none;
}

.modal-buttons {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 15px;
}

.modal-buttons button {
  border: none;
  padding: 10px 16px;
  border-radius: 9px;
  cursor: pointer;
  font-weight: 600;
}

.cancel {
  background: #e9ece9;
}

.send {
  background: #27382c;
  color: white;
}

.send:disabled {
  opacity: .6;
  cursor: not-allowed;
}

footer {
  text-align: center;
  padding: 25px;
  color: #7d867f;
  font-size: 13px;
}

@media(max-width:750px) {

  .cards {
    grid-template-columns: 1fr;
  }

  .header-inner {
    gap: 10px;
  }

  .logo {
    font-size: 19px;
  }

  .welcome h1 {
    font-size: 27px;
  }

  .section {
    padding: 18px;
  }

}

</style>

</head>


<body>

<header>

<div class="container header-inner">

<div class="logo">
Admin Desa Sungai Kelambu
</div>

<button class="logout" onclick="logout()">
Keluar
</button>

</div>

</header>


<main class="container">

<div class="welcome">

<h1>Dashboard Admin</h1>

<p>
Kelola Pengaduan, Tanggapan, dan Pesan masyarakat.
</p>

</div>


<div id="status" class="status"></div>


<div class="cards">

<div class="card">

<small>Total Pengaduan</small>

<div
  class="number"
  id="jumlahPengaduan"
>
0
</div>

</div>


<div class="card">

<small>Total Tanggapan</small>

<div
  class="number"
  id="jumlahTanggapan"
>
0
</div>

</div>


<div class="card">

<small>Total Pesan</small>

<div
  class="number"
  id="jumlahPesan"
>
0
</div>

</div>

</div>


<!-- PENGADUAN -->

<section class="section">

<div class="section-header">

<h2>Pengaduan Masyarakat</h2>

<button
  class="refresh"
  onclick="muatData()"
>
↻ Muat ulang
</button>

</div>


<div id="daftarPengaduan">

<div class="loading">
Memuat pengaduan...
</div>

</div>

</section>


<!-- TANGGAPAN -->

<section class="section">

<div class="section-header">

<h2>Tanggapan</h2>

</div>


<div id="daftarTanggapan">

<div class="loading">
Memuat tanggapan...
</div>

</div>

</section>


<!-- PESAN -->

<section class="section">

<div class="section-header">

<h2>Pesan Masyarakat</h2>

</div>


<div id="daftarPesan">

<div class="loading">
Memuat pesan...
</div>

</div>

</section>


</main>


<footer>

© 2026 Desa Sungai Kelambu

</footer>


<!-- MODAL TANGGAPAN -->

<div
  class="modal"
  id="modal"
>

<div class="modal-box">

<h2>Beri Tanggapan</h2>

<div
  id="infoPengaduan"
  style="margin-bottom:15px; line-height:1.6;"
>
</div>


<textarea
  id="isiTanggapan"
  placeholder="Tulis tanggapan untuk masyarakat..."
></textarea>


<div class="modal-buttons">

<button
  class="cancel"
  onclick="tutupModal()"
>
Batal
</button>


<button
  class="send"
  onclick="kirimTanggapan()"
>
Kirim Tanggapan
</button>

</div>

</div>

</div>


<script>

/* =========================
   CEK LOGIN
========================= */

if (
  localStorage.getItem("adminLogin") !== "true"
) {

  window.location.href = "admin.html";

}


/* =========================
   WEB APP BARU
========================= */

const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbxNjSokYlcC1fl1UUhzwTa3hEUOQMwodbQtGY17YwTA_dWNMzlpxwANUaaS9GvGpnQqwQ/exec";


let pengaduanDipilih = null;


/* =========================
   ELEMENT
========================= */

const statusBox =
document.getElementById("status");

const daftarPengaduan =
document.getElementById("daftarPengaduan");

const daftarTanggapan =
document.getElementById("daftarTanggapan");

const daftarPesan =
document.getElementById("daftarPesan");


/* =========================
   STATUS
========================= */

function status(text, error=false) {

  statusBox.textContent = text;

  statusBox.className =
    error
    ? "status error"
    : "status";

  statusBox.style.display = "block";

  if (!error) {

    setTimeout(() => {

      statusBox.style.display = "none";

    }, 3000);

  }

}


/* =========================
   ESCAPE
========================= */

function aman(text) {

  return String(text ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   AMBIL DATA
========================= */

async function ambil(action) {

  const response =
    await fetch(
      WEB_APP_URL +
      "?action=" +
      encodeURIComponent(action)
    );


  if (!response.ok) {

    throw new Error(
      "HTTP " + response.status
    );

  }


  const result =
    await response.json();


  if (
    result.success === false
  ) {

    throw new Error(
      result.error ||
      result.message ||
      "Gagal mengambil data"
    );

  }


  return result.data || [];

}


/* =========================
   CARI KOLOM
========================= */

function kolom(obj, names) {

  const keys =
    Object.keys(obj);


  for (
    const wanted of names
  ) {

    const found =
      keys.find(key =>
        key
          .toLowerCase()
          .trim() ===
        wanted
          .toLowerCase()
          .trim()
      );


    if (found !== undefined) {

      return obj[found];

    }

  }


  for (
    const key of keys
  ) {

    for (
      const wanted of names
    ) {

      if (
        key
          .toLowerCase()
          .includes(
            wanted.toLowerCase()
          )
      ) {

        return obj[key];

      }

    }

  }


  return "";

}


/* =========================
   PENGADUAN
========================= */

function tampilPengaduan(data) {

  document.getElementById(
    "jumlahPengaduan"
  ).textContent = data.length;


  if (!data.length) {

    daftarPengaduan.innerHTML = `
      <div class="empty">
        Belum ada pengaduan.
      </div>
    `;

    return;

  }


  daftarPengaduan.innerHTML =
    data.map((item,index) => {

      const nama =
        kolom(item,[
          "nama",
          "nama lengkap",
          "nama pengadu"
        ]);


      const tanggal =
        kolom(item,[
          "tanggal",
          "waktu",
          "timestamp",
          "date"
        ]);


      const isi =
        kolom(item,[
          "pengaduan",
          "isi",
          "ajuan",
          "keluhan",
          "keterangan"
        ]);


      return `

        <div class="item">

          <div class="item-top">

            <div class="name">
              ${aman(
                nama ||
                "Masyarakat"
              )}
            </div>

            <div class="date">
              ${aman(tanggal)}
            </div>

          </div>


          <div class="label">
            Pengaduan
          </div>

          <div class="text">
            ${aman(
              isi ||
              "Tidak ada isi."
            )}
          </div>


          <button
            class="reply-btn"
            onclick='bukaTanggapan(${JSON.stringify({
              nama:nama,
              pengaduan:isi
            })})'
          >
            Beri Tanggapan
          </button>

        </div>

      `;

    }).join("");

}


/* =========================
   TANGGAPAN
========================= */

function tampilTanggapan(data) {

  document.getElementById(
    "jumlahTanggapan"
  ).textContent = data.length;


  if (!data.length) {

    daftarTanggapan.innerHTML = `
      <div class="empty">
        Belum ada tanggapan.
      </div>
    `;

    return;

  }


  daftarTanggapan.innerHTML =
    data.map(item => {

      const nama =
        kolom(item,[
          "nama",
          "nama lengkap"
        ]);


      const tanggal =
        kolom(item,[
          "tanggal",
          "waktu",
          "timestamp",
          "date"
        ]);


      const pengaduan =
        kolom(item,[
          "pengaduan",
          "isi pengaduan",
          "ajuan"
        ]);


      const tanggapan =
        kolom(item,[
          "tanggapan",
          "isi tanggapan",
          "balasan",
          "jawaban",
          "respon"
        ]);


      return `

        <div class="item">

          <div class="item-top">

            <div class="name">
              ${aman(
                nama ||
                "Masyarakat"
              )}
            </div>

            <div class="date">
              ${aman(tanggal)}
            </div>

          </div>


          <div class="label">
            Pengaduan
          </div>

          <div
            class="text"
            style="margin-bottom:12px"
          >
            ${aman(
              pengaduan ||
              "-"
            )}
          </div>


          <div class="label">
            Tanggapan Admin
          </div>

          <div class="text">
            ${aman(
              tanggapan ||
              "-"
            )}
          </div>

        </div>

      `;

    }).join("");

}


/* =========================
   PESAN
========================= */

function tampilPesan(data) {

  document.getElementById(
    "jumlahPesan"
  ).textContent = data.length;


  if (!data.length) {

    daftarPesan.innerHTML = `
      <div class="empty">
        Belum ada pesan.
      </div>
    `;

    return;

  }


  daftarPesan.innerHTML =
    data.map(item => {

      const nama =
        kolom(item,[
          "nama",
          "nama lengkap",
          "pengirim"
        ]);


      const tanggal =
        kolom(item,[
          "tanggal",
          "waktu",
          "timestamp",
          "date"
        ]);


      const isi =
        kolom(item,[
          "pesan",
          "isi",
          "message",
          "keterangan"
        ]);


      return `

        <div class="item">

          <div class="item-top">

            <div class="name">
              ${aman(
                nama ||
                "Masyarakat"
              )}
            </div>

            <div class="date">
              ${aman(tanggal)}
            </div>

          </div>


          <div class="label">
            Pesan
          </div>

          <div class="text">
            ${aman(
              isi ||
              "-"
            )}
          </div>

        </div>

      `;

    }).join("");

}


/* =========================
   MUAT SEMUA
========================= */

async function muatData() {

  status(
    "Memuat data dari Google Sheet..."
  );


  daftarPengaduan.innerHTML =
    `<div class="loading">
      Memuat pengaduan...
    </div>`;


  daftarTanggapan.innerHTML =
    `<div class="loading">
      Memuat tanggapan...
    </div>`;


  daftarPesan.innerHTML =
    `<div class="loading">
      Memuat pesan...
    </div>`;


  try {

    const [
      pengaduan,
      tanggapan,
      pesan
    ] = await Promise.all([

      ambil("ajuan"),

      ambil("tanggapan"),

      ambil("pesan")

    ]);


    tampilPengaduan(pengaduan);

    tampilTanggapan(tanggapan);

    tampilPesan(pesan);


    status(
      "Data berhasil dimuat."
    );


  } catch(error) {

    console.error(error);

    status(
      "Gagal mengambil data: " +
      error.message,
      true
    );

  }

}


/* =========================
   BUKA MODAL
========================= */

function bukaTanggapan(data) {

  pengaduanDipilih = data;


  document.getElementById(
    "infoPengaduan"
  ).innerHTML = `

    <b>
      ${aman(
        data.nama ||
        "Masyarakat"
      )}
    </b>

    <br><br>

    ${aman(
      data.pengaduan ||
      "-"
    )}

  `;


  document.getElementById(
    "isiTanggapan"
  ).value = "";


  document.getElementById(
    "modal"
  ).style.display = "flex";

}


/* =========================
   TUTUP MODAL
========================= */

function tutupModal() {

  document.getElementById(
    "modal"
  ).style.display = "none";

  pengaduanDipilih = null;

}


/* =========================
   KIRIM TANGGAPAN
========================= */

async function kirimTanggapan() {

  if (!pengaduanDipilih) {
    return;
  }


  const isi =
    document.getElementById(
      "isiTanggapan"
    ).value.trim();


  if (!isi) {

    alert(
      "Tulis tanggapan terlebih dahulu."
    );

    return;

  }


  const tombol =
    document.querySelector(
      ".send"
    );


  tombol.disabled = true;

  tombol.textContent =
    "Mengirim...";


  try {

    const response =
      await fetch(
        WEB_APP_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body: JSON.stringify({

            action: "tanggapan",

            nama:
              pengaduanDipilih.nama,

            pengaduan:
              pengaduanDipilih.pengaduan,

            tanggapan:
              isi

          })

        }
      );


    if (!response.ok) {

      throw new Error(
        "HTTP " + response.status
      );

    }


    const result =
      await response.json();


    if (
      result.success === false
    ) {

      throw new Error(
        result.error ||
        result.message ||
        "Tanggapan gagal dikirim"
      );

    }


    tutupModal();


    alert(
      "Tanggapan berhasil dikirim."
    );


    await muatData();


  } catch(error) {

    console.error(error);

    alert(
      "Tanggapan gagal dikirim: " +
      error.message
    );

  }


  tombol.disabled = false;

  tombol.textContent =
    "Kirim Tanggapan";

}


/* =========================
   LOGOUT
========================= */

function logout() {

  localStorage.removeItem(
    "adminLogin"
  );

  window.location.href =
    "admin.html";

}


/* =========================
   MULAI
========================= */

muatData();

</script>

</body>
                                  </html>
