<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ajuan - Desa Sungai Kelambu</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f8f5ed;
      color: #27382c;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      margin-bottom: 25px;
      color: #666;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #27382c;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #hasil {
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      display: none;
    }

    .success {
      background: #e3f3e7;
      color: #245c35;
    }

    .error {
      background: #f8dddd;
      color: #8a2222;
    }

    .kembali {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #27382c;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Form Ajuan Desa</h1>

    <p class="subtitle">
      Silakan isi formulir ajuan dengan lengkap dan benar.
    </p>

    <form id="formAjuan">

      <label for="nama">Nama Lengkap</label>
      <input
        type="text"
        id="nama"
        placeholder="Masukkan nama lengkap"
        required
      >

      <label for="no_hp">Nomor HP</label>
      <input
        type="tel"
        id="no_hp"
        placeholder="Contoh: 081234567890"
        required
      >

      <label for="jenis_ajuan">Jenis Ajuan</label>
      <select id="jenis_ajuan" required>
        <option value="">-- Pilih jenis ajuan --</option>
        <option value="Surat Keterangan">Surat Keterangan</option>
        <option value="Surat Pengantar">Surat Pengantar</option>
        <option value="Administrasi Kependudukan">Administrasi Kependudukan</option>
        <option value="Pembangunan">Pembangunan</option>
        <option value="Fasilitas Desa">Fasilitas Desa</option>
        <option value="Lainnya">Lainnya</option>
      </select>

      <label for="isi_ajuan">Isi Ajuan</label>
      <textarea
        id="isi_ajuan"
        placeholder="Tuliskan ajuan kamu..."
        required
      ></textarea>

      <button type="submit" id="btnKirim">
        Kirim Ajuan
      </button>

    </form>

    <div id="hasil"></div>

    <a href="index.html" class="kembali">
      ← Kembali ke Beranda
    </a>

  </div>

  <script>

    const WEB_APP_URL =
      "https://script.google.com/macros/s/AKfycbyBbMpn9j3wFj0_m0uogVlxXFHJ23mevm96pHdhTQSsWB-X-GkJCOsVTWWX-or5eYqn/exec";

    const form = document.getElementById("formAjuan");
    const tombol = document.getElementById("btnKirim");
    const hasil = document.getElementById("hasil");

    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      tombol.disabled = true;
      tombol.textContent = "Mengirim...";

      hasil.style.display = "none";

      const data = {
        type: "ajuan",
        nama: document.getElementById("nama").value.trim(),
        no_hp: document.getElementById("no_hp").value.trim(),
        jenis_ajuan: document.getElementById("jenis_ajuan").value,
        isi_ajuan: document.getElementById("isi_ajuan").value.trim()
      };

      try {

        await fetch(WEB_APP_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify(data)
        });

        hasil.className = "success";
        hasil.textContent =
          "Ajuan berhasil dikirim. Silakan tunggu tanggapan dari desa.";

        hasil.style.display = "block";

        form.reset();

      } catch (error) {

        hasil.className = "error";
        hasil.textContent =
          "Ajuan gagal dikirim. Silakan coba lagi.";

        hasil.style.display = "block";

      }

      tombol.disabled = false;
      tombol.textContent = "Kirim Ajuan";

    });

  </script>

</body>
  </html>
