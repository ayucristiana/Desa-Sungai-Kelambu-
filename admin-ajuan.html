<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Data Ajuan - Admin</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f8f5ed;
      color: #27382c;
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    .header {
      background: #27382c;
      color: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
    }

    .header h1 {
      margin-bottom: 6px;
    }

    .header p {
      opacity: 0.8;
      font-size: 14px;
    }

    .kembali {
      display: inline-block;
      margin-top: 15px;
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    .box {
      background: white;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      overflow-x: auto;
    }

    .status {
      margin-bottom: 15px;
      padding: 12px;
      background: #f3f3ee;
      border-radius: 8px;
      text-align: center;
      color: #666;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 800px;
    }

    th {
      background: #27382c;
      color: white;
      padding: 12px;
      text-align: left;
      font-size: 14px;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid #eee;
      font-size: 14px;
      vertical-align: top;
    }

    tr:hover {
      background: #fafaf6;
    }

    .kosong {
      text-align: center;
      padding: 30px;
      color: #777;
    }

    .refresh {
      margin-bottom: 15px;
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      background: #27382c;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      background: #fff3cd;
      color: #856404;
      font-size: 12px;
      font-weight: bold;
    }

    @media (max-width: 600px) {

      body {
        padding: 12px;
      }

      .header {
        padding: 17px;
      }

      .header h1 {
        font-size: 21px;
      }

      .box {
        padding: 12px;
      }

    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">

      <h1>Data Ajuan</h1>

      <p>
        Data ajuan masyarakat Desa Sungai Kelambu
      </p>

      <a href="dashboard.html" class="kembali">
        ← Kembali ke Dashboard
      </a>

    </div>


    <div class="box">

      <button class="refresh" onclick="ambilData()">
        🔄 Refresh Data
      </button>

      <div id="status" class="status">
        Mengambil data...
      </div>

      <div id="tabel"></div>

    </div>

  </div>


  <script>

    const WEB_APP_URL =
      "https://script.google.com/macros/s/AKfycbyBbMpn9j3wFj0_m0uogVlxXFHJ23mevm96pHdhTQSsWB-X-GkJCOsVTWWX-or5eYqn/exec";


    // Cek login admin
    if (localStorage.getItem("adminLogin") !== "true") {

      window.location.href = "admin.html";

    }


    async function ambilData() {

      const status = document.getElementById("status");
      const tabel = document.getElementById("tabel");

      status.textContent = "Mengambil data...";
      tabel.innerHTML = "";

      try {

        const response = await fetch(
          WEB_APP_URL + "?action=ajuan"
        );

        const hasil = await response.json();


        if (hasil.status !== "success") {

          status.textContent =
            "Gagal mengambil data.";

          return;

        }


        const data = hasil.data;


        if (!data || data.length === 0) {

          status.textContent =
            "Belum ada data ajuan.";

          tabel.innerHTML =
            '<div class="kosong">Belum ada ajuan dari masyarakat.</div>';

          return;

        }


        status.textContent =
          "Total ajuan: " + data.length;


        let html = `
          <table>

            <thead>

              <tr>
                <th>No</th>
                <th>Nama</th>
                <th>No. HP</th>
                <th>Jenis Ajuan</th>
                <th>Isi Ajuan</th>
                <th>Status</th>
              </tr>

            </thead>

            <tbody>
        `;


        data.forEach(function(item, index) {

          html += `
            <tr>

              <td>${index + 1}</td>

              <td>
                ${item["Nama"] || item["nama"] || ""}
              </td>

              <td>
                ${item["No HP"] || item["no_hp"] || ""}
              </td>

              <td>
                ${item["Jenis Ajuan"] || item["jenis_ajuan"] || ""}
              </td>

              <td>
                ${item["Isi Ajuan"] || item["isi_ajuan"] || ""}
              </td>

              <td>
                <span class="badge">
                  ${item["Status"] || "Menunggu"}
                </span>
              </td>

            </tr>
          `;

        });


        html += `
            </tbody>
          </table>
        `;


        tabel.innerHTML = html;


      } catch (error) {

        status.textContent =
          "Gagal mengambil data dari server.";

        tabel.innerHTML =
          '<div class="kosong">Periksa koneksi atau deployment Apps Script.</div>';

      }

    }


    // Ambil data saat halaman dibuka
    ambilData();

  </script>

</body>
</html>
