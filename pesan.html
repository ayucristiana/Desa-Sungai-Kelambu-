<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pesan - Desa Sungai Kelambu</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f8f5ed;
      color: #27382c;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #27382c;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #hasil {
      display: none;
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
    }

    .success {
      background: #e3f3e7;
      color: #245c35;
    }

    .error {
      background: #f8dddd;
      color: #8a2222;
    }

    .kembali {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #27382c;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Hubungi Desa</h1>

    <p class="subtitle">
      Silakan kirim pesan kepada Pemerintah Desa Sungai Kelambu.
    </p>

    <form id="formPesan">

      <label for="nama">Nama Lengkap</label>

      <input
        type="text"
        id="nama"
        placeholder="Masukkan nama lengkap"
        required
      >

      <label for="no_hp">Nomor HP</label>

      <input
        type="tel"
        id="no_hp"
        placeholder="Contoh: 081234567890"
        required
      >

      <label for="email">Email</label>

      <input
        type="email"
        id="email"
        placeholder="Masukkan email"
        required
      >

      <label for="subjek">Subjek</label>

      <input
        type="text"
        id="subjek"
        placeholder="Masukkan subjek pesan"
        required
      >

      <label for="pesan">Pesan</label>

      <textarea
        id="pesan"
        placeholder="Tuliskan pesan kamu..."
        required
      ></textarea>

      <button type="submit" id="btnKirim">
        Kirim Pesan
      </button>

    </form>

    <div id="hasil"></div>

    <a href="index.html" class="kembali">
      ← Kembali ke Beranda
    </a>

  </div>

  <script>

    const WEB_APP_URL =
      "https://script.google.com/macros/s/AKfycbyBbMpn9j3wFj0_m0uogVlxXFHJ23mevm96pHdhTQSsWB-X-GkJCOsVTWWX-or5eYqn/exec";

    const form = document.getElementById("formPesan");
    const tombol = document.getElementById("btnKirim");
    const hasil = document.getElementById("hasil");

    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      tombol.disabled = true;
      tombol.textContent = "Mengirim...";

      hasil.style.display = "none";

      const data = {
        type: "pesan",
        nama: document.getElementById("nama").value.trim(),
        no_hp: document.getElementById("no_hp").value.trim(),
        email: document.getElementById("email").value.trim(),
        subjek: document.getElementById("subjek").value.trim(),
        pesan: document.getElementById("pesan").value.trim()
      };

      try {

        await fetch(WEB_APP_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify(data)
        });

        hasil.className = "success";

        hasil.textContent =
          "Pesan berhasil dikirim. Terima kasih telah menghubungi desa.";

        hasil.style.display = "block";

        form.reset();

      } catch (error) {

        hasil.className = "error";

        hasil.textContent =
          "Pesan gagal dikirim. Silakan coba lagi.";

        hasil.style.display = "block";

      }

      tombol.disabled = false;
      tombol.textContent = "Kirim Pesan";

    });

  </script>

</body>
  </html>
