<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tanggapan Pengaduan - Desa Sungai Kelambu</title>

  <link rel="icon" type="image/png" href="img/favicon.png">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f7f4;
      color: #173b2b;
    }

    header {
      background: #14532d;
      color: white;
      padding: 18px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header p {
      margin: 6px 0 0;
      opacity: 0.9;
      font-size: 14px;
    }

    .container {
      max-width: 700px;
      margin: 30px auto;
      padding: 0 18px;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
      color: #14532d;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5cf;
      border-radius: 9px;
      font-size: 15px;
      font-family: inherit;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: none;
      border-radius: 9px;
      background: #15803d;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #166534;
    }

    .hasil {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #ecfdf5;
      border: 1px solid #86efac;
    }

    .error {
      background: #fef2f2;
      border-color: #fca5a5;
    }

    .info {
      margin-top: 18px;
      padding: 14px;
      background: #f0fdf4;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.6;
    }

    .back {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      color: #14532d;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>Admin Desa Sungai Kelambu</h1>
  <p>Pengelolaan Tanggapan Pengaduan</p>
</header>

<div class="container">

  <div class="card">

    <h2>Berikan Tanggapan</h2>

    <div class="info">
      Masukkan <strong>Token Pengaduan</strong> masyarakat,
      lalu tuliskan tanggapan dari pihak Desa.
    </div>

    <form id="formTanggapan">

      <label for="token">Token Pengaduan</label>

      <input
        type="text"
        id="token"
        placeholder="Contoh: SKL-2026-123456"
        required
      >

      <label for="status">Status Pengaduan</label>

      <select id="status">
        <option value="Sudah Ditanggapi">
          Sudah Ditanggapi
        </option>

        <option value="Sedang Diproses">
          Sedang Diproses
        </option>

        <option value="Selesai">
          Selesai
        </option>
      </select>

      <label for="tanggapan">
        Tanggapan Desa
      </label>

      <textarea
        id="tanggapan"
        placeholder="Tuliskan tanggapan dari pihak Desa..."
        required
      ></textarea>

      <button type="submit">
        Kirim Tanggapan
      </button>

    </form>

    <div
      id="hasil"
      class="hasil"
    ></div>

    <a
      href="dashboard.html"
      class="back"
    >
      ← Kembali ke Dashboard
    </a>

  </div>

</div>

<script>

const WEB_APP_URL =
  "https://script.google.com/macros/s/AKfycbxuL4Wg27aujlSoGK_Ri_8LyqFLc4-VGTIlu1lzl843vgg5rqgYzIJJZOOp5jO_mCtrPQ/exec";


document
  .getElementById("formTanggapan")
  .addEventListener("submit", function(e) {

    e.preventDefault();

    const token =
      document
        .getElementById("token")
        .value
        .trim()
        .toUpperCase();

    const status =
      document
        .getElementById("status")
        .value;

    const tanggapan =
      document
        .getElementById("tanggapan")
        .value
        .trim();

    const hasil =
      document.getElementById("hasil");

    if (!token || !tanggapan) {

      hasil.style.display = "block";

      hasil.className = "hasil error";

      hasil.innerHTML =
        "Token dan tanggapan wajib diisi.";

      return;
    }


    const data = {

      type: "tanggapan",

      token: token,

      status: status,

      tanggapan: tanggapan

    };


    fetch(
      WEB_APP_URL,
      {
        method: "POST",

        mode: "no-cors",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify(data)
      }
    )
    .then(function() {

      hasil.style.display = "block";

      hasil.className = "hasil";

      hasil.innerHTML =
        "<strong>Tanggapan berhasil dikirim.</strong><br>" +
        "Token: " + token + "<br>" +
        "Status: " + status;

      document
        .getElementById("tanggapan")
        .value = "";

    })
    .catch(function(error) {

      hasil.style.display = "block";

      hasil.className = "hasil error";

      hasil.innerHTML =
        "Terjadi kesalahan saat mengirim tanggapan.";

      console.error(error);

    });

  });

</script>

</body>
</html>
